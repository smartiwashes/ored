<div class="min-h-screen bg-slate-950 flex flex-col justify-center items-center py-12 sm:px-6 lg:px-8 relative overflow-hidden" style="direction: rtl; font-family: 'Outfit', 'Inter', sans-serif;">
  
  <!-- Premium background glow elements -->
  <div class="absolute top-1/4 left-1/4 w-80 h-80 bg-red-600/10 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-blue-600/10 rounded-full blur-[100px] pointer-events-none"></div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md z-10 text-center">
    <div class="flex justify-center items-center gap-3 mb-2">
      <span class="w-4 h-4 bg-red-600 rounded-full animate-ping"></span>
      <span class="text-3xl font-black text-white tracking-tight">Ooredoo</span>
      <span class="text-xs bg-red-600/20 text-red-400 font-extrabold px-2 py-0.5 rounded-full border border-red-500/20">ADMIN</span>
    </div>
    <h2 class="text-lg font-semibold text-slate-400">لوحة تحكم المشرفين والتحقق</h2>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md z-10 px-4">
    <div class="bg-slate-900/80 backdrop-blur-xl py-8 px-6 shadow-2xl shadow-black/50 border border-slate-800/80 rounded-3xl sm:px-10">
      
      <!-- Error Banner -->
      @if (errorMessage()) {
      <div class="mb-5 bg-red-950/40 border border-red-500/30 text-red-200 px-4 py-3 rounded-2xl text-xs font-bold flex items-center gap-3">
        <svg class="w-4 h-4 text-red-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
      }

      <form (submit)="onSubmit($event)" class="space-y-6">
        <!-- Email field -->
        <div>
          <label for="email" class="block text-xs font-black text-slate-300 uppercase tracking-wider mb-2 text-right">البريد الإلكتروني</label>
          <div class="relative">
            <input id="email" 
                   type="email" 
                   required 
                   [value]="email()"
                   (input)="email.set($any($event.target).value)"
                   placeholder="admin@ooredoo.com"
                   class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-600 outline-none focus:border-red-600 transition-colors text-right" />
          </div>
        </div>

        <!-- Password field -->
        <div>
          <label for="password" class="block text-xs font-black text-slate-300 uppercase tracking-wider mb-2 text-right">كلمة المرور</label>
          <div class="relative">
            <input id="password" 
                   type="password" 
                   required 
                   [value]="password()"
                   (input)="password.set($any($event.target).value)"
                   placeholder="••••••••"
                   class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-600 outline-none focus:border-red-600 transition-colors text-right" />
          </div>
        </div>

        <!-- Submit button -->
        <div>
          <button type="submit" 
                  [disabled]="isLoading()"
                  class="w-full flex justify-center items-center bg-red-600 hover:bg-red-500 text-white font-extrabold text-sm py-3.5 px-4 rounded-2xl transition-all duration-200 cursor-pointer shadow-lg shadow-red-900/20 active:scale-98 disabled:opacity-50 disabled:cursor-not-allowed">
            @if (isLoading()) {
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              جاري التحقق...
            @} @else {
              تسجيل الدخول
            }
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
