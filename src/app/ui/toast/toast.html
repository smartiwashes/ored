@if (toastService.toast(); as t) {
<div dir="rtl"
    class="fixed top-5 left-4 right-4 sm:left-1/2 sm:right-auto sm:w-auto sm:min-w-[320px] sm:max-w-md z-9999 flex items-center gap-3 px-4 py-3.5 rounded-2xl bg-white border border-gray-100 shadow-[0_12px_40px_rgba(0,0,0,0.12)] transition-all duration-300 animate-slide-in">
    <div class="shrink-0 w-8 h-8 rounded-full flex items-center justify-center" [ngClass]="{
            'bg-blue-50 text-blue-600': t.type === 'info',
            'bg-emerald-50 text-emerald-600': t.type === 'success',
            'bg-red-50 text-[#ED1C24]': t.type === 'error'
          }">
        @if (t.type === 'success') {
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
        </svg>
        } @else if (t.type === 'error') {
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
        </svg>
        } @else {
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M11.25 11.25l.041-.02a.75.75 0 111.063.852l-.708 2.836a.75.75 0 001.063.852l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12v-.008z" />
        </svg>
        }
    </div>

    <!-- Text -->
    <span class="text-sm font-bold text-gray-900 grow text-right leading-relaxed">{{ t.message }}</span>

    <!-- Close Button -->
    <button (click)="toastService.hide()"
        class="text-gray-400 hover:text-gray-600 transition-colors p-1 shrink-0 mr-auto">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </button>
</div>
}
